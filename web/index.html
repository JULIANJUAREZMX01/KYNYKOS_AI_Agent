<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nanobot Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
        .status-badge { @apply inline-block px-3 py-1 rounded-full text-sm font-medium; }
        .status-ok { @apply bg-green-100 text-green-800; }
        .status-error { @apply bg-red-100 text-red-800; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100">
    <div class="min-h-screen flex flex-col">
        <!-- Header -->
        <header class="bg-gray-800 border-b border-gray-700 py-4 px-6">
            <div class="max-w-6xl mx-auto flex justify-between items-center">
                <div>
                    <h1 class="text-2xl font-bold">🤖 Nanobot Dashboard</h1>
                    <p class="text-gray-400 text-sm">AI Assistant for QUINTANA</p>
                </div>
                <div id="status" class="text-right">
                    <div class="status-badge status-ok">🟢 Conectado</div>
                    <p class="text-xs text-gray-400 mt-2" id="version">v0.1.0</p>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="flex-1 max-w-6xl mx-auto w-full py-8 px-6">
            <!-- Tabs -->
            <div role="tablist" aria-label="Navegación del panel" class="flex gap-4 mb-6 border-b border-gray-700">
                <button id="tab-sessions" role="tab" aria-selected="true" tabindex="0" aria-controls="sessions-tab" onclick="showTab('sessions')" class="tab-btn px-4 py-2 text-sm font-medium border-b-2 border-blue-500 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-400 rounded-t">
                    📋 Sesiones
                </button>
                <button id="tab-memory" role="tab" aria-selected="false" tabindex="-1" aria-controls="memory-tab" onclick="showTab('memory')" class="tab-btn px-4 py-2 text-sm font-medium border-b-2 border-transparent hover:border-gray-600 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-400 rounded-t">
                    💾 Memoria
                </button>
                <button id="tab-skills" role="tab" aria-selected="false" tabindex="-1" aria-controls="skills-tab" onclick="showTab('skills')" class="tab-btn px-4 py-2 text-sm font-medium border-b-2 border-transparent hover:border-gray-600 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-400 rounded-t">
                    🛠️ Skills
                </button>
                <button id="tab-logs" role="tab" aria-selected="false" tabindex="-1" aria-controls="logs-tab" onclick="showTab('logs')" class="tab-btn px-4 py-2 text-sm font-medium border-b-2 border-transparent hover:border-gray-600 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-400 rounded-t">
                    📝 Logs
                </button>
            </div>

            <!-- Sessions Tab -->
            <div id="sessions-tab" role="tabpanel" tabindex="0" aria-labelledby="tab-sessions" class="tab-content focus:outline-none focus-visible:ring-1 focus-visible:ring-blue-500 rounded">
                <div class="bg-gray-800 rounded-lg p-6">
                    <h2 class="text-lg font-bold mb-4">Sesiones Recientes</h2>
                    <div id="sessions-list" class="space-y-2 max-h-96 overflow-y-auto">
                        <p class="text-gray-400">Cargando...</p>
                    </div>
                </div>
            </div>

            <!-- Memory Tab -->
            <div id="memory-tab" role="tabpanel" tabindex="0" aria-labelledby="tab-memory" class="tab-content hidden focus:outline-none focus-visible:ring-1 focus-visible:ring-blue-500 rounded">
                <div class="bg-gray-800 rounded-lg p-6">
                    <label for="memory-text" class="block text-lg font-bold mb-4">Memoria Persistente (MEMORY.md)</label>
                    <textarea id="memory-text" class="w-full h-96 bg-gray-900 text-gray-100 p-4 rounded border border-gray-700 font-mono text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Cargando..."></textarea>
                    <div class="mt-4 flex items-center gap-3">
                        <button id="save-memory-btn" onclick="saveMemory()" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed rounded font-medium text-sm focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-400 transition-colors">
                            💾 Guardar Memoria
                        </button>
                        <span id="memory-status" role="status" aria-live="polite" class="text-sm"></span>
                    </div>
                </div>
            </div>

            <!-- Skills Tab -->
            <div id="skills-tab" role="tabpanel" tabindex="0" aria-labelledby="tab-skills" class="tab-content hidden focus:outline-none focus-visible:ring-1 focus-visible:ring-blue-500 rounded">
                <div class="bg-gray-800 rounded-lg p-6">
                    <h2 class="text-lg font-bold mb-4">Skills Disponibles</h2>
                    <div id="skills-list" class="space-y-4 max-h-96 overflow-y-auto">
                        <p class="text-gray-400">Cargando...</p>
                    </div>
                </div>
            </div>

            <!-- Logs Tab -->
            <div id="logs-tab" role="tabpanel" tabindex="0" aria-labelledby="tab-logs" class="tab-content hidden focus:outline-none focus-visible:ring-1 focus-visible:ring-blue-500 rounded">
                <div class="bg-gray-800 rounded-lg p-6">
                    <h2 class="text-lg font-bold mb-4">Logs</h2>
                    <div id="logs-list" class="bg-gray-900 p-4 rounded font-mono text-xs text-green-400 max-h-96 overflow-y-auto" style="max-height: 400px;">
                        <p class="text-gray-400">Sin logs disponibles</p>
                    </div>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="bg-gray-800 border-t border-gray-700 py-4 px-6">
            <div class="max-w-6xl mx-auto text-center text-sm text-gray-400">
                <p>Nanobot v0.1.0 • Powered by Anthropic Claude + Groq • Deployed on Render</p>
            </div>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
